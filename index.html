<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Primary Meta Tags -->
    <title>Neon Rogue: Cyber Survivor</title>
    <meta name="title" content="Neon Rogue: Cyber Survivor">
    <meta name="description" content="A fast-paced cyberpunk arcade survival game. Play for free directly in your browser!">

    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://neonrouge.aztech.solutions/">
    <meta property="og:title" content="Neon Rogue: Cyber Survivor">
    <meta property="og:description" content="A fast-paced cyberpunk arcade survival game. Play for free directly in your browser!">
    <meta property="og:image" content="https://neonrouge.aztech.solutions/IMG_1241.jpeg">

    <!-- Twitter / X / Discord -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://neonrouge.aztech.solutions/">
    <meta property="twitter:title" content="Neon Rogue: Cyber Survivor">
    <meta property="twitter:description" content="A fast-paced cyberpunk arcade survival game. Play for free directly in your browser!">
    <meta property="twitter:image" content="https://neonrouge.aztech.solutions/IMG_1241.jpeg">
    
    <!-- Retro Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050510; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
        }
        .hud-text {
            color: #0ff; text-shadow: 0 0 10px #0ff; font-size: 24px;
            font-weight: bold; margin: 0;
        }
        #xp-bar-container {
            width: 100%; height: 10px; background: #222;
            border: 1px solid #0f0; margin-top: 10px;
        }
        #xp-bar {
            width: 0%; height: 100%; background: #0f0;
            box-shadow: 0 0 10px #0f0; transition: width 0.2s;
        }
        
        /* NEON RETRO START SCREEN MODAL */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #050510 0%, #09132e 45%, #001a33 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; pointer-events: auto; text-align: center;
            font-family: 'Press Start 2P', cursive;
        }

        .title-container {
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pixel-subtitle {
            color: #f0f; 
            font-size: 14px;
            text-shadow: 2px 2px 0px #300;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .pixel-title {
            color: #ffffff; 
            font-size: 36px;
            text-shadow: 
                4px 4px 0 #0ff,
                -4px -4px 0 #f0f,
                0px 8px 0px #050510;
            margin: 0;
            line-height: 1.3;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .retro-btn {
            font-family: 'Press Start 2P', cursive;
            background-color: #0b1a2a; 
            color: #0ff; 
            border: 4px solid #030814;
            padding: 12px 16px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.6), inset 4px 4px 0px rgba(0, 255, 255, 0.2);
            text-transform: uppercase;
            transition: transform 0.1s, color 0.2s, background-color 0.2s;
        }

        .retro-btn:hover {
            background-color: #122840;
            color: #fff;
        }

        .retro-btn:active {
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.6);
            transform: translateY(4px);
        }

        .play-btn {
            background-color: #0ff; 
            color: #050510; 
            font-size: 16px;
            padding: 16px 30px;
            border: 4px solid #005555;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3), inset 4px 4px 0px rgba(255, 255, 255, 0.4), 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .play-btn:hover {
            background-color: #fff;
            color: #050510;
        }

        .play-btn:active {
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.4);
        }

        #upgrade-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.90); flex-direction: column; justify-content: center; 
            align-items: center; z-index: 100; pointer-events: auto; text-align: center;
        }
        .upgrade-btn {
            background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #f0f;
            padding: 15px 30px; margin: 10px 0; font-size: 18px; font-weight: bold;
            font-family: 'Courier New', Courier, monospace; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5); width: 80%; max-width: 300px;
        }
        .upgrade-btn:hover, .upgrade-btn:active { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }
    </style>
</head>
<body>

    <!-- NEON RETRO START SCREEN -->
    <div id="start-screen">
        <div class="title-container">
            <div class="pixel-subtitle">NEON ROGUE</div>
            <div class="pixel-title">SURVIVOR</div>
        </div>

        <div class="menu-buttons">
            <div class="btn-row">
                <button id="start-btn" class="retro-btn play-btn">PLAY NOW</button>
            </div>
            <div class="btn-row">
                <button class="retro-btn">OPTIONS</button>
                <button class="retro-btn">SHOP</button>
            </div>
            <div class="btn-row">
                <button class="retro-btn">MORE GAMES</button>
                <button class="retro-btn">LEADERBOARDS</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="ui-layer">
        <div>
            <p class="hud-text">SCORE: <span id="scoreDisplay">0</span></p>
            <p class="hud-text" style="font-size: 16px; color: #f0f; text-shadow: 0 0 8px #f0f;">WAVE: <span id="waveDisplay">1</span></p>
            <p class="hud-text" style="font-size: 16px; color: #0f0; text-shadow: 0 0 8px #0f0; margin-top:5px;">LVL: <span id="levelDisplay">1</span></p>
            <div id="xp-bar-container"><div id="xp-bar"></div></div>
        </div>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-modal">
        <h1 style="color:#ff0; text-shadow: 0 0 20px #ff0; font-size: 30px; font-family: 'Press Start 2P', cursive;">SYSTEM UPGRADE</h1>
        <div id="upgrade-options" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isGameStarted = false;
        let isGameOver = false;
        let isPaused = false;
        let score = 0; let wave = 1;

        const player = {
            x: canvas.width / 2, y: canvas.height / 2,
            radius: 15, color: '#0ff', speed: 4, vx: 0, vy: 0,
            autoShootTimer: 0, shootInterval: 25, multiShot: 1, pierce: 1,
            level: 1, xp: 0, maxXp: 10, magnetRadius: 80
        };

        const projectiles = []; const enemies = []; const particles = []; const gems = []; 
        const joystick = { active: false, originX: 0, originY: 0, currentX: 0, currentY: 0, maxDistance: 50 };

        // Start Game Listener
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            isGameStarted = true;
        });

        const upgradePool = [
            { name: 'Overclock', desc: '+ Fire Rate', action: () => player.shootInterval = Math.max(5, player.shootInterval - 4) },
            { name: 'Spread Core', desc: '+1 Projectile', action: () => player.multiShot += 1 },
            { name: 'Plasma Piercer', desc: 'Shots pierce targets', action: () => player.pierce += 1 },
            { name: 'Ion Thrusters', desc: '+ Movement Speed', action: () => player.speed += 1.5 },
            { name: 'Gravity Mod', desc: 'Increased XP Range', action: () => player.magnetRadius += 50 }
        ];

        function triggerLevelUp() {
            isPaused = true; player.level++;
            player.xp -= player.maxXp; player.maxXp = Math.floor(player.maxXp * 1.5);
            document.getElementById('levelDisplay').innerText = player.level;
            updateXpBar();

            const choices = [...upgradePool].sort(() => 0.5 - Math.random()).slice(0, 3);
            const optionsContainer = document.getElementById('upgrade-options');
            optionsContainer.innerHTML = '';
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'upgrade-btn';
                btn.innerHTML = `<strong>${choice.name}</strong><br><span style="font-size:12px">${choice.desc}</span>`;
                btn.onclick = (e) => {
                    e.preventDefault(); choice.action();
                    document.getElementById('upgrade-modal').style.display = 'none';
                    isPaused = false; joystick.active = false;
                };
                optionsContainer.appendChild(btn);
            });
            document.getElementById('upgrade-modal').style.display = 'flex';
        }

        function updateXpBar() {
            document.getElementById('xp-bar').style.width = Math.min(100, (player.xp / player.maxXp) * 100) + '%';
        }

        // --- INPUT HANDLING ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isGameStarted || isPaused) return;
            if (isGameOver) return resetGame();
            const touch = e.touches[0]; joystick.active = true;
            joystick.originX = touch.clientX; joystick.originY = touch.clientY;
            joystick.currentX = touch.clientX; joystick.currentY = touch.clientY;
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystick.active || isPaused || !isGameStarted) return;
            joystick.currentX = e.touches[0].clientX; joystick.currentY = e.touches[0].clientY;
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault(); joystick.active = false; player.vx = 0; player.vy = 0;
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (!isGameStarted || isPaused) return;
            if (isGameOver) return resetGame();
            joystick.active = true;
            joystick.originX = e.clientX; joystick.originY = e.clientY;
            joystick.currentX = e.clientX; joystick.currentY = e.clientY;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!joystick.active || isPaused || !isGameStarted) return;
            joystick.currentX = e.clientX; joystick.currentY = e.clientY;
        });
        window.addEventListener('mouseup', () => { joystick.active = false; player.vx = 0; player.vy = 0; });

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (isGameOver && e.key === 'enter') resetGame(); });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- GAME LOGIC ---
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let ex, ey;
            if (side === 0) { ex = Math.random() * canvas.width; ey = -30; }
            else if (side === 1) { ex = canvas.width + 30; ey = Math.random() * canvas.height; }
            else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 30; }
            else { ex = -30; ey = Math.random() * canvas.height; }

            enemies.push({ x: ex, y: ey, radius: 12 + Math.random() * 8, color: '#f0f', speed: 1 + Math.random() * (0.5 + wave * 0.2), hp: 1 + Math.floor(wave / 2) });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color: color });
            try { if ('vibrate' in navigator) navigator.vibrate(20); } catch (err) {}
        }

        function update() {
            if (!isGameStarted || isGameOver || isPaused) return;

            if (joystick.active) {
                const dx = joystick.currentX - joystick.originX; const dy = joystick.currentY - joystick.originY;
                const dist = Math.hypot(dx, dy); const norm = Math.min(dist, joystick.maxDistance) / joystick.maxDistance;
                if (dist > 0) { player.vx = (dx / dist) * player.speed * norm; player.vy = (dy / dist) * player.speed * norm; }
            } else {
                player.vx = 0; player.vy = 0;
                if (keys['w'] || keys['arrowup']) player.vy = -player.speed;
                if (keys['s'] || keys['arrowdown']) player.vy = player.speed;
                if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
                if (keys['d'] || keys['arrowright']) player.vx = player.speed;
            }

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + player.vx));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + player.vy));

            player.autoShootTimer++;
            if (player.autoShootTimer >= player.shootInterval) {
                let nearest = null; let minDist = Infinity;
                enemies.forEach(e => { const d = Math.hypot(e.x - player.x, e.y - player.y); if (d < minDist) { minDist = d; nearest = e; }});
                
                if (nearest) {
                    const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                    const spreadAngle = 0.2; 
                    const startAngle = baseAngle - (spreadAngle * (player.multiShot - 1)) / 2;

                    for(let s = 0; s < player.multiShot; s++) {
                        projectiles.push({ x: player.x, y: player.y, vx: Math.cos(startAngle + spreadAngle * s) * 12, vy: Math.sin(startAngle + spreadAngle * s) * 12, radius: 4, color: '#ff0', pierce: player.pierce, hit: [] });
                    }
                    player.autoShootTimer = 0;
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i]; p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
            }

            for (let i = gems.length - 1; i >= 0; i--) {
                const g = gems[i]; const dist = Math.hypot(player.x - g.x, player.y - g.y);
                if (dist < player.magnetRadius) {
                    const angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * 8; g.y += Math.sin(angle) * 8;
                }
                if (dist < player.radius + g.radius) {
                    player.xp += 1; updateXpBar(); gems.splice(i, 1);
                    if (player.xp >= player.maxXp) triggerLevelUp();
                }
            }

            if (Math.random() < 0.02 + (wave * 0.005)) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i]; const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;

                if (Math.hypot(player.x - e.x, player.y - e.y) - player.radius - e.radius < 1) {
                    isGameOver = true; try { if ('vibrate' in navigator) navigator.vibrate(200); } catch (err) {}
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if(p.hit.includes(e)) continue; 

                    if (Math.hypot(p.x - e.x, p.y - e.y) - e.radius - p.radius < 1) {
                        e.hp--; p.hit.push(e); p.pierce--;
                        createExplosion(p.x, p.y, '#fff');

                        if (p.pierce <= 0) projectiles.splice(j, 1);

                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color); gems.push({x: e.x, y: e.y, radius: 4, color: '#0f0'});
                            enemies.splice(i, 1); score += 10; document.getElementById('scoreDisplay').innerText = score;
                            if (score % 200 === 0) { wave++; document.getElementById('waveDisplay').innerText = wave; }
                        }
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)'; ctx.lineWidth = 1;
            const gridSize = 50; const offsetX = (player.x * 0.1) % gridSize; const offsetY = (player.y * 0.1) % gridSize;
            for (let x = -offsetX; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = -offsetY; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            if (!isGameStarted) return;

            ctx.shadowBlur = 10; ctx.shadowColor = '#0f0'; ctx.fillStyle = '#0f0';
            gems.forEach(g => { ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2); ctx.fill(); });
            ctx.shadowBlur = 0;

            if (!isGameOver) {
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.05)'; ctx.beginPath(); ctx.arc(player.x, player.y, player.magnetRadius, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 15; ctx.shadowColor = player.color; ctx.fillStyle = player.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            }

            ctx.shadowBlur = 10; ctx.shadowColor = '#ff0'; ctx.fillStyle = '#ff0';
            projectiles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); });

            ctx.shadowColor = '#f0f'; ctx.fillStyle = '#f0f';
            enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill(); }); ctx.shadowBlur = 0;

            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1.0;

            if (joystick.active && !isPaused) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(joystick.originX, joystick.originY, joystick.maxDistance, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)'; ctx.beginPath(); ctx.arc(joystick.currentX, joystick.currentY, 15, 0, Math.PI * 2); ctx.fill();
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f00'; ctx.shadowBlur = 20; ctx.shadowColor = '#f00';
                ctx.font = 'bold 40px Courier New'; ctx.textAlign = 'center'; ctx.fillText('SYSTEM FAILURE', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.font = '20px Courier New'; ctx.fillText('Tap or press ENTER to reboot', canvas.width / 2, canvas.height / 2 + 30); ctx.shadowBlur = 0;
            }
        }

        function resetGame() {
            score = 0; wave = 1; player.x = canvas.width / 2; player.y = canvas.height / 2;
            player.level = 1; player.xp = 0; player.maxXp = 10; player.shootInterval = 25; player.multiShot = 1; player.pierce = 1; player.speed = 4; player.magnetRadius = 80;
            enemies.length = 0; projectiles.length = 0; particles.length = 0; gems.length = 0;
            document.getElementById('scoreDisplay').innerText = score; document.getElementById('waveDisplay').innerText = wave; document.getElementById('levelDisplay').innerText = player.level;
            updateXpBar(); isGameOver = false;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
