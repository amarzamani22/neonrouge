<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rogue: Cyber Survivor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents scrolling on mobile */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-text {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div>
            <p class="hud-text">SCORE: <span id="scoreDisplay">0</span></p>
            <p class="hud-text" style="font-size: 16px; color: #f0f; text-shadow: 0 0 8px #f0f;">WAVE: <span id="waveDisplay">1</span></p>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State
        let score = 0;
        let wave = 1;
        let isGameOver = false;

        // Player Object
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            color: '#0ff',
            speed: 4,
            vx: 0,
            vy: 0,
            autoShootTimer: 0,
            shootInterval: 15 // frames between shots
        };

        // Arrays for game entities
        const projectiles = [];
        const enemies = [];
        const particles = [];

        // Virtual Joystick State
        const joystick = {
            active: false,
            originX: 0,
            originY: 0,
            currentX: 0,
            currentY: 0,
            maxDistance: 50
        };

        // --- INPUT HANDLING ---
        
        // Touch (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            if (isGameOver) return resetGame();
            const touch = e.touches[0];
            joystick.active = true;
            joystick.originX = touch.clientX;
            joystick.originY = touch.clientY;
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            const touch = e.touches[0];
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;
        });

        canvas.addEventListener('touchend', () => {
            joystick.active = false;
            player.vx = 0;
            player.vy = 0;
        });

        // Keyboard (Desktop)
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (isGameOver && e.key === 'Enter') resetGame();
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- GAME LOGIC ---

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let ex, ey;
            if (side === 0) { ex = Math.random() * canvas.width; ey = -30; } // Top
            else if (side === 1) { ex = canvas.width + 30; ey = Math.random() * canvas.height; } // Right
            else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 30; } // Bottom
            else { ex = -30; ey = Math.random() * canvas.height; } // Left

            enemies.push({
                x: ex,
                y: ey,
                radius: 12 + Math.random() * 8,
                color: '#f0f',
                speed: 1 + Math.random() * (0.5 + wave * 0.2),
                hp: 1 + Math.floor(wave / 2)
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color
                });
            }
            // Haptic feedback for mobile
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function getNearestEnemy() {
            let nearest = null;
            let minDist = Infinity;
            enemies.forEach(enemy => {
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = enemy;
                }
            });
            return nearest;
        }

        function update() {
            if (isGameOver) return;

            // Player Movement - Joystick
            if (joystick.active) {
                const dx = joystick.currentX - joystick.originX;
                const dy = joystick.currentY - joystick.originY;
                const distance = Math.hypot(dx, dy);
                const normalizedDist = Math.min(distance, joystick.maxDistance) / joystick.maxDistance;
                
                if (distance > 0) {
                    player.vx = (dx / distance) * player.speed * normalizedDist;
                    player.vy = (dy / distance) * player.speed * normalizedDist;
                }
            } 
            // Player Movement - Keyboard
            else {
                player.vx = 0;
                player.vy = 0;
                if (keys['w'] || keys['arrowup']) player.vy = -player.speed;
                if (keys['s'] || keys['arrowdown']) player.vy = player.speed;
                if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
                if (keys['d'] || keys['arrowright']) player.vx = player.speed;
            }

            // Apply movement and boundaries
            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Auto-Shoot Logic
            player.autoShootTimer++;
            if (player.autoShootTimer >= player.shootInterval) {
                const target = getNearestEnemy();
                if (target) {
                    const angle = Math.atan2(target.y - player.y, target.x - player.x);
                    projectiles.push({
                        x: player.x,
                        y: player.y,
                        vx: Math.cos(angle) * 10,
                        vy: Math.sin(angle) * 10,
                        radius: 4,
                        color: '#ff0'
                    });
                    player.autoShootTimer = 0;
                }
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }

            // Update Enemies
            if (Math.random() < 0.02 + (wave * 0.005)) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // Check collision with player
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer - player.radius - e.radius < 1) {
                    isGameOver = true;
                    if (navigator.vibrate) navigator.vibrate(200);
                }

                // Check collision with projectiles
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    const distToProj = Math.hypot(p.x - e.x, p.y - e.y);
                    if (distToProj - e.radius - p.radius < 1) {
                        e.hp--;
                        projectiles.splice(j, 1);
                        createExplosion(p.x, p.y, '#fff');

                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color);
                            enemies.splice(i, 1);
                            score += 10;
                            document.getElementById('scoreDisplay').innerText = score;
                            
                            // Wave progression
                            if (score % 200 === 0) {
                                wave++;
                                document.getElementById('waveDisplay').innerText = wave;
                                player.shootInterval = Math.max(5, player.shootInterval - 1);
                            }
                        }
                        break;
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- DRAW LOGIC ---

        function draw() {
            // Cyberpunk grid background with motion blur effect
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offsetX = (player.x * 0.1) % gridSize;
            const offsetY = (player.y * 0.1) % gridSize;

            for (let x = -offsetX; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = -offsetY; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (!isGameOver) {
                // Draw Player (Neon Glow)
                ctx.shadowBlur = 15;
                ctx.shadowColor = player.color;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }

            // Draw Projectiles
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0';
            ctx.fillStyle = '#ff0';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Enemies
            ctx.shadowColor = '#f0f';
            ctx.fillStyle = '#f0f';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Virtual Joystick (Mobile)
            if (joystick.active) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(joystick.originX, joystick.originY, joystick.maxDistance, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(joystick.currentX, joystick.currentY, 15, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Game Over Screen
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#f00';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f00';
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('SYSTEM FAILURE', canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = '#0ff';
                ctx.shadowColor = '#0ff';
                ctx.font = '20px Courier New';
                ctx.fillText('Tap or press ENTER to reboot', canvas.width / 2, canvas.height / 2 + 30);
                ctx.shadowBlur = 0;
            }
        }

        function resetGame() {
            score = 0;
            wave = 1;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.shootInterval = 15;
            enemies.length = 0;
            projectiles.length = 0;
            particles.length = 0;
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('waveDisplay').innerText = wave;
            isGameOver = false;
        }

        // Main Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start game
        loop();
    </script>
</body>
</html>
